# Docker compose app for the multimodel branch (Ollama 0.40.16 + dual-buffer + the multi-model rules of
# /models/dualbuf.yaml, ROCm + Vulkan). A test instance next to the others.
#
# Set in an .env file next to this one (or in the environment): OLLAMA_PORT, MODELS_DIR, RENDER_NODE_ROCM,
# RENDER_NODE_VULKAN (the render nodes of the cards: `ls -l /dev/dri/by-path`), CPU_LIMIT, MEMORY_LIMIT.
#
# - Image: the moving tag :multimodel (every "dualbuf-image" build of the multimodel branch overwrites it; the
#   workflow also prints a fixed <version>-dualbuf-<commit> tag). Pull by hand for a newer build, then restart.
# - The config: $MODELS_DIR/dualbuf.yaml (example: docs/dualbuf.example.yaml). Only this image reads it.
#   Fill the devices section from the log line "dualbuf devices" / "inference compute" (PCI address or name).
# - The other Ollama instances share the model directory: run one of them at a time on the GPU (docs/NAS-TESTS.md).
services:
  ollama-multimodel:
    image: ghcr.io/csaki89/ollama-dualbuf:multimodel
    container_name: ollama-multimodel
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT}:11434"
    devices:
      # /dev/kfd: the ROCm backend needs it, and the Vulkan backend uses it for the compute power state of an AMD card
      # (an empty KFD compute queue while a model is loaded: without it the GPU stays at low clocks in a GPU/CPU split)
      - /dev/kfd:/dev/kfd
      # the ROCm card; for a further card add its render node
      - /dev/dri/${RENDER_NODE_ROCM}:/dev/dri/${RENDER_NODE_ROCM}
      # the Vulkan card: its render node
      - /dev/dri/${RENDER_NODE_VULKAN}:/dev/dri/${RENDER_NODE_VULKAN}
    group_add:
      - video
      - render
    ulimits:
      # pinned host buffers and keep_in_ram: pinned (mlock of the parked model files)
      memlock: -1
    # the KV of a swapped (parked) model is kept in /dev/shm: Docker gives 64 MB by default. It counts against the
    # memory limit while used (the scheduler's RAM budget sees it)
    shm_size: "32gb"
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT}"
          memory: ${MEMORY_LIMIT}
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
      LLAMA_ARG_LOAD_MODE: "none"
      # the defaults below are the env level: dualbuf.yaml defaults and model sections override them
      LLAMA_ARG_DUAL_BUFFER: "1"
      LLAMA_ARG_AUTO_ZONES: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      # several models loaded at once (GPU, Vulkan card, CPU instances); the RAM budget and the swap rule decide
      OLLAMA_MAX_LOADED_MODELS: "6"
      OLLAMA_NOPRUNE: "1"
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${MODELS_DIR}:/models
