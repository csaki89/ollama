# Builds the ROCm (gfx1030 only) Ollama image with the llama.cpp dual-buffer patch
# (llama/compat/003-dual-buffer.patch) and pushes it to ghcr.io/<owner>/ollama-dualbuf.
#
# Fork-only file: the upstream workflows (release.yaml, test*.yaml, latest.yaml) only react to
# v* tags, pull requests and releases, so a push to the dual-buffer branch never starts them.
name: dualbuf-image

on:
  push:
    # dual-buffer-0.40.16: the update to Ollama v0.40.16 (llama.cpp b12177), built before it replaces dual-buffer
    # multimodel: the multi-model work (ROCm + Vulkan image), its own moving tag :multimodel
    branches: [dual-buffer, dual-buffer-0.40.16, multimodel]
  workflow_dispatch:
    inputs:
      cold:
        description: "Build without the compiler and layer caches (to measure a cold build; the caches are saved afterwards)"
        type: boolean
        default: false

concurrency:
  group: dualbuf-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ollama-dualbuf
  GPU_ARCH: gfx1030
  # only the CPU variant the target (Broadwell, AVX2) loads: ggml scores haswell highest there (no AVX512 / AVX_VNNI);
  # GGML_CPU_VARIANTS is patch 004 (ggml builds every variant as a dependency of ggml otherwise)
  CPU_VARIANTS: haswell

jobs:
  image:
    # "[skip image]" in the head commit message: no image build (the other workflows still run)
    if: github.repository_owner != 'ollama' && !contains(github.event.head_commit.message, '[skip image]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tags
        id: meta
        run: |
          # the fork does not carry every upstream release tag (and pushing a v* tag to the fork would start the upstream
          # release.yaml there), so read them from upstream: the version below is the binary version Ollama checks
          # against "model requires ollama version ..." (read only, nothing is pushed)
          git fetch --quiet --no-tags https://github.com/ollama/ollama.git '+refs/tags/v*:refs/tags/v*'
          ver="$(git describe --tags --match 'v[0-9]*' --abbrev=0)"
          ver="${ver#v}"
          sha="$(git rev-parse --short=7 HEAD)"
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # same GOFLAGS as the upstream release workflow (binary version and release mode)
          echo GOFLAGS="'-ldflags=-w -s \"-X=github.com/ollama/ollama/version.Version=$ver\" \"-X=github.com/ollama/ollama/server.mode=release\"'" >> "$GITHUB_OUTPUT"
          echo "tag=$ver-dualbuf-$sha" >> "$GITHUB_OUTPUT"
          # moving tag per branch (the last build of the branch overwrites it); a docker tag is [A-Za-z0-9_.-], at most 128
          branch="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-128)"
          echo "branch_tag=$branch" >> "$GITHUB_OUTPUT"
          echo "Image tags: $ver-dualbuf-$sha (fixed), $branch (moving)"

      - uses: docker/setup-buildx-action@v3

      # ccache and the Go build cache live in BuildKit cache mounts, which a fresh runner does not have: they are kept in the
      # Actions cache and injected into / extracted from BuildKit around the build (the post steps run in reverse order)
      - name: Prepare the compiler cache directories
        run: mkdir -p "${{ runner.temp }}/ci-cache/ccache" "${{ runner.temp }}/ci-cache/go-build"

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ci-cache
          key: dualbuf-build-${{ github.run_id }}
          restore-keys: ${{ inputs.cold && 'cold-no-restore-' || 'dualbuf-build-' }}

      - name: Inject the compiler cache into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "${{ runner.temp }}/ci-cache/ccache": "/root/.ccache",
              "${{ runner.temp }}/ci-cache/go-build": "/root/.cache/go-build"
            }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the image the moving branch tag points to before this build (empty for the first build of a branch), compared below
      - name: Previous build of the branch
        id: prev
        run: |
          ref="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "previous $ref: ${digest:-none}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            FLAVOR=${{ github.ref_name == 'multimodel' && 'rocm-vulkan' || 'rocm' }}
            EXTRA_APT_PACKAGES=${{ github.ref_name == 'multimodel' && 'mesa-vulkan-drivers' || '' }}
            LLAMA_SERVER_VULKAN_TARGETS=ggml-vulkan
            GOFLAGS=${{ steps.meta.outputs.GOFLAGS }}
            LLAMA_SERVER_ROCM_CMAKE_ARGS=-DAMDGPU_TARGETS=${{ env.GPU_ARCH }}
            ROCM_KEEP_ARCH=${{ env.GPU_ARCH }}
            LLAMA_SERVER_ROCM_TARGETS=ggml-hip ggml ggml-hide-dri
            LLAMA_SERVER_CPU_CMAKE_ARGS=-DGGML_CPU_VARIANTS=${{ env.CPU_VARIANTS }}
            LLAMA_SERVER_CPU_TARGETS=llama-server llama-quantize
          # layer cache (base, dependencies, Go modules) in the registry: the ROCm base does not fit the 10 GB Actions cache
          cache-from: ${{ !inputs.cold && format('type=registry,ref={0}:buildcache', steps.meta.outputs.image) || '' }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          # fixed (version-hash) tag and the moving branch tag; no :latest, so a build of an experimental branch does not
          # overwrite a tag another branch (or the server) uses
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.branch_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.description=Ollama ${{ steps.meta.outputs.version }} ROCm (${{ env.GPU_ARCH }}) with llama.cpp dual-buffer

      - name: Smoke test
        run: |
          img="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker pull "$img"
          docker image inspect "$img" --format 'size: {{.Size}} bytes'
          docker run --rm --entrypoint /bin/ollama "$img" --version
          if [ "${{ github.ref_name }}" = multimodel ]; then
            docker run --rm --entrypoint /bin/sh "$img" -c 'set -e; ls -la /usr/lib/ollama/vulkan; test -f /usr/lib/ollama/vulkan/libggml-vulkan.so; ls /usr/share/vulkan/icd.d/; ls /usr/share/vulkan/icd.d/radeon_icd*.json; test -f /usr/lib/ollama/rocm_v7_2/libollama-hide-dri.so; test -f /usr/lib/ollama/rocm_v7_2/libggml-hip.so'
          fi
          docker run --rm --entrypoint /bin/sh "$img" -c '
            echo "== /usr/lib/ollama (sizes)"; du -sh /usr/lib/ollama /usr/lib/ollama/*/
            for d in /usr/lib/ollama/rocm*; do
              echo "== $d"; ls -la "$d"
              echo "== sizes in $d"; du -sh "$d"/* 2>/dev/null
              for lib in rocblas hipblaslt; do
                L="$d/$lib/library"
                if [ -d "$L" ]; then
                  echo "== $lib kernels per gfx target ($L)"
                  ls "$L" | grep -o "gfx[0-9a-z]*" | sort | uniq -c
                  echo "files without gfx in name: $(ls "$L" | grep -vc gfx)"
                  du -sh "$L"
                else
                  echo "== no $lib/library in $d"
                fi
              done
            done
          '
          # the VMM tests must be in the image and find all their libraries
          docker run --rm --entrypoint /bin/bash "$img" -c '
            set -e
            ls -la /usr/lib/ollama/libggml-cpu-*.so
            test -f /usr/lib/ollama/libggml-cpu-haswell.so
            test "$(ls /usr/lib/ollama/libggml-cpu-*.so | wc -l)" -eq 1
            T=/usr/lib/ollama/dualbuf-test
            export LD_LIBRARY_PATH=/usr/lib/ollama/rocm_v7_2:/usr/lib/ollama
            ls -la "$T"
            for b in "$T/vmm-stress" "$T/vmm-stress-impl"; do
              ldd "$b" | tee /tmp/ldd.txt
              if grep -q "not found" /tmp/ldd.txt; then echo "missing library for $b"; exit 1; fi
            done
            bash -n "$T/vmm-stress.sh"
            rc=0; "$T/vmm-stress-impl" || rc=$?
            test "$rc" -eq 2
          '

      # what differs from the previous build of the branch (file names; sizes of every rebuilt file differ anyway); the
      # moving branch tag already points to this build here, so the reference is its digest from before the build
      - name: Compare with the previous build of the branch
        continue-on-error: true
        run: |
          img="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          if [ -z "${{ steps.prev.outputs.digest }}" ]; then
            echo "first build of ${{ steps.meta.outputs.branch_tag }}, nothing to compare"; exit 0
          fi
          ref="${{ steps.meta.outputs.image }}@${{ steps.prev.outputs.digest }}"
          echo "reference: $ref"
          docker pull -q "$ref"
          list() {
            docker run --rm --entrypoint /bin/sh "$1" -c 'cd /usr && find bin lib/ollama \( -type f -o -type l \) | sort'
          }
          list "$ref" > ref.txt
          list "$img" > new.txt
          echo "== only in the reference (<) / only in the new image (>)"
          diff ref.txt new.txt || true
          echo "== $(wc -l < ref.txt) files in the reference, $(wc -l < new.txt) in the new image"
