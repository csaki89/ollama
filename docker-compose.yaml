# TrueNAS SCALE: Apps -> Discover Apps -> Install via YAML (custom app).
# Test instance of the dual-buffer Ollama, next to the running ollama/ollama:0.40.2-rocm
# (that one stays on port 30068). Test API: http://<nas>:30069
#
# Before the first start:
#  1. The image tag is pinned to the build of commit 5060a03 (workflow run 43373735011). For a newer build use the tag the "dualbuf-image" workflow printed
#     (0.40.2-dualbuf-<7 char commit>). Do not use :latest, a restart could pull a different build.
#  2. If the ghcr.io package is private, log in on the NAS first (see docs/SUMMARY.md).
#
# Shared model directory: this instance reads the SAME blobs/manifests as the running one.
#  - Do not `ollama pull` or delete models through this test instance while the other one is
#    running, and OLLAMA_NOPRUNE=1 keeps this instance from deleting blobs at startup.
#  - Per-model variants (Modelfile `FROM <model>` + `PARAMETER use_mmap false`) only add a small
#    manifest, the blobs are shared. See docs/SUMMARY.md.
services:
  ollama-dualbuf:
    image: ghcr.io/csaki89/ollama-dualbuf:0.40.2-dualbuf-5060a03
    container_name: ollama-dualbuf
    restart: unless-stopped
    ports:
      - "30069:11434"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri/renderD129:/dev/dri/renderD129
    group_add:
      - video
      - render
    ulimits:
      memlock: -1
    # cgroup limit: the dual-buffer RAM guard reads it (free RAM = memory limit - usage), so the
    # extra host copy is sized against these 100 GB, not against the NAS total
    deploy:
      resources:
        limits:
          cpus: "60"
          memory: 100G
    healthcheck:
      test: ["CMD", "/bin/ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # RX 6700 is gfx1031, the image only contains gfx1030 code
      HSA_OVERRIDE_GFX_VERSION: "10.3.0"
      # the llama.cpp dual-buffer feature (repacked CPU weights also kept in ROCm_Host for prompt op offload)
      LLAMA_ARG_DUAL_BUFFER: "1"
      # dual-buffer needs mmap off. Ollama only passes --load-mode none when a request/Modelfile sets
      # use_mmap=false, otherwise llama-server reads this variable. Safe default for every model.
      LLAMA_ARG_LOAD_MODE: "none"
      # three-zone placement without manual settings: the flex band comes from two --fit runs (max and initial
      # context, dense and MoE), the KV starts small and grows with the use (in place with VMM on ROCm), and the
      # flex layers go to the CPU when the KV needs VRAM and come back in a new conversation. Needs mmap off (above)
      # and flash attention auto/on (the Ollama default on ROCm). Remove to turn it off; LLAMA_KV_NO_VMM: "1" turns
      # only the VMM growth off (copy fallback).
      LLAMA_ARG_AUTO_ZONES: "1"
      # debug for the VMM path of the growing KV (every mapping, access setting, growth, release in the log);
      # remove once the VMM path is confirmed on the NAS
      GGML_CUDA_VMM_DEBUG: "1"
      # same settings as the running instance
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # shared model dir: do not prune blobs at startup
      OLLAMA_NOPRUNE: "1"
      OLLAMA_MODELS: /models
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      # read-write on purpose: Modelfile variants (use_mmap false) write a manifest here
      - /mnt/nvme/ollama/models:/models
